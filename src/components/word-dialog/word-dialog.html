<article class="word-detail">
	<header class="word-header">
		<p class="word-id"></p>
		<h2 class="word-thai" lang="th">Word</h2>
		<p class="word-english"></p>
		<p class="word-category"></p>
		<div class="button-row word-speak">
			<button type="button" class="button button-secondary speak-thai">
				▶ Thai
			</button>
			<button type="button" class="button button-secondary speak-english">
				▶ English
			</button>
		</div>
	</header>

	<section class="word-examples" aria-label="Example">
		<p class="word-example-thai" lang="th"></p>
		<p class="word-example-english"></p>
	</section>

	<div class="word-progress-wrap">
		<table class="word-progress">
			<thead>
				<tr>
					<th scope="col"><span class="visually-hidden">Field</span></th>
					<th scope="col">Thai → English</th>
					<th scope="col">English → Thai</th>
				</tr>
			</thead>
			<tbody></tbody>
		</table>
	</div>

	<p class="word-notice" role="status"></p>

	<div class="word-actions">
		<button type="button" class="button word-queue">Queue for next practice</button>
		<button type="button" class="button button-secondary word-hide">Hide</button>
		<button type="button" class="button button-secondary word-reset">
			Reset to NEW
		</button>
		<button type="button" class="button word-close">Close</button>
	</div>
</article>
