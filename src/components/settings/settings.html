<main class="settings">
	<nav class="screen-nav">
		<a class="button button-secondary" href="#/home">← Home</a>
	</nav>
	<h1>Settings</h1>

	<section class="settings-section" aria-labelledby="settings-speech">
		<h2 id="settings-speech">Speech</h2>
		<div class="voice" data-language="thai">
			<h3>Thai</h3>
			<p class="voice-name"></p>
			<label class="voice-rate">
				<span>Rate</span>
				<input type="range" step="0.05" />
				<output></output>
			</label>
			<button type="button" class="button button-secondary voice-sample">
				Play sample
			</button>
		</div>
		<div class="voice" data-language="english">
			<h3>English</h3>
			<p class="voice-name"></p>
			<label class="voice-rate">
				<span>Rate</span>
				<input type="range" step="0.05" />
				<output></output>
			</label>
			<button type="button" class="button button-secondary voice-sample">
				Play sample
			</button>
		</div>
		<div class="setting-toggle">
			<label>
				<input type="checkbox" class="wake-toggle" />
				<span>Poke Bluetooth device before playing audio</span>
			</label>
			<p class="setting-hint">
				Plays a moment of silence before speech, so wireless earphones that
				have gone to sleep do not miss the start of a word.
			</p>
		</div>
	</section>

	<section class="settings-section" aria-labelledby="settings-data">
		<h2 id="settings-data">Data</h2>
		<p>
			Back up your progress, or restore it on this or another device. Word
			content is not included.
		</p>
		<div class="button-row">
			<button type="button" class="button data-export">Export progress</button>
			<button type="button" class="button button-secondary data-import">
				Import progress
			</button>
		</div>
		<input type="file" class="data-file" accept="application/json,.json" hidden />
		<p class="data-status" role="status"></p>
	</section>

	<section class="settings-section" aria-labelledby="settings-about">
		<h2 id="settings-about">About</h2>
		<p>Version <span class="app-version"></span></p>
	</section>
</main>
